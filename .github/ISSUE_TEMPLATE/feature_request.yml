name: Idea or feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to do that you cannot do now?
    validations: { required: true }
  - type: textarea
    id: safety
    attributes:
      label: Safety considerations
      description: "Could this heat or move something unexpectedly? How should the server protect the user?"
